apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-smart-hiring-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ai-smart-hiring-system
  template:
    metadata:
      labels:
        app: ai-smart-hiring-system
    spec:
      containers:
        - name: app
          image: YOUR_DOCKERHUB_USERNAME/ai-smart-hiring-system:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 5000
          readinessProbe:
            httpGet:
              path: /
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 5000
            initialDelaySeconds: 30
            periodSeconds: 30
          volumeMounts:
            - name: uploads
              mountPath: /app/uploads
      volumes:
        - name: uploads
          persistentVolumeClaim:
            claimName: ai-smart-hiring-uploads
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ai-smart-hiring-uploads
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: ai-smart-hiring-service
spec:
  type: NodePort
  selector:
    app: ai-smart-hiring-system
  ports:
    - port: 5000
      targetPort: 5000
      nodePort: 30500
