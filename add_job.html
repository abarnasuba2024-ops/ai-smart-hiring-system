{% extends "base.html" %}

{% block content %}

<div class="form-page">

    <div class="form-page-header">

        <div>

            <span class="eyebrow">
                JOB MANAGEMENT
            </span>

            <h1>
                Create New Job
            </h1>

            <p>
                Add a job vacancy and define the skills required.
            </p>

        </div>

        <a
            href="{{ url_for('index') }}"
            class="back-btn"
        >
            ← Back
        </a>

    </div>


    <div class="form-card">

        <form
            method="POST"
            action="{{ url_for('add_job') }}"
        >

            <div class="form-section">

                <h3>
                    Job Information
                </h3>

                <p>
                    Enter the basic details for this position.
                </p>

            </div>


            <div class="form-grid">

                <div class="form-group full">

                    <label>
                        Job Title
                    </label>

                    <input
                        type="text"
                        name="title"
                        placeholder="e.g. Python Developer"
                        required
                    >

                </div>


                <div class="form-group">

                    <label>
                        Location
                    </label>

                    <input
                        type="text"
                        name="location"
                        placeholder="e.g. Coimbatore / Remote"
                    >

                </div>


                <div class="form-group">

                    <label>
                        Required Skills
                    </label>

                    <input
                        type="text"
                        name="skills"
                        placeholder="Python, Flask, SQL, Machine Learning"
                    >

                    <small>
                        Separate multiple skills using commas.
                    </small>

                </div>


                <div class="form-group full">

                    <label>
                        Job Description
                    </label>

                    <textarea
                        name="description"
                        rows="8"
                        placeholder="Describe the responsibilities, requirements and qualifications..."
                        required
                    ></textarea>

                </div>

            </div>


            <div class="form-actions">

                <a
                    href="{{ url_for('index') }}"
                    class="cancel-btn"
                >
                    Cancel
                </a>

                <button
                    type="submit"
                    class="primary-btn"
                >
                    Create Job →
                </button>

            </div>

        </form>

    </div>

</div>

{% endblock %}
