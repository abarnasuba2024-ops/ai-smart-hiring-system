<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Create Job | AI Smart Hiring</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            background: #f5f7fb;
            color: #1f2937;
        }

        /* SIDEBAR */
        .sidebar {
            position: fixed;
            left: 0;
            top: 0;
            width: 245px;
            height: 100vh;
            background: #111827;
            padding: 25px 18px;
        }

        .brand {
            color: white;
            font-size: 21px;
            font-weight: 700;
            padding: 0 12px 30px;
        }

        .brand span {
            color: #60a5fa;
        }

        .menu-title {
            color: #6b7280;
            font-size: 11px;
            text-transform: uppercase;
            margin: 15px 12px 10px;
            letter-spacing: 1px;
        }

        .menu a {
            display: block;
            text-decoration: none;
            color: #cbd5e1;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 5px;
            font-size: 14px;
        }

        .menu a:hover,
        .menu a.active {
            background: #2563eb;
            color: white;
        }

        /* MAIN */
        .main {
            margin-left: 245px;
            min-height: 100vh;
        }

        /* TOPBAR */
        .topbar {
            height: 70px;
            background: white;
            border-bottom: 1px solid #e5e7eb;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 35px;
        }

        .topbar h2 {
            font-size: 19px;
        }

        .back-link {
            text-decoration: none;
            color: #2563eb;
            font-size: 14px;
            font-weight: 600;
        }

        /* CONTENT */
        .content {
            padding: 35px;
            max-width: 1050px;
        }

        .page-title {
            margin-bottom: 25px;
        }

        .page-title h1 {
            font-size: 28px;
            margin-bottom: 7px;
        }

        .page-title p {
            color: #6b7280;
            font-size: 14px;
        }

        /* CARD */
        .job-card {
            background: white;
            border: 1px solid #e5e7eb;
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 4px 18px rgba(15, 23, 42, 0.04);
        }

        .section-title {
            font-size: 17px;
            font-weight: 700;
            margin-bottom: 22px;
        }

        /* FORM */
        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 22px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        .full {
            grid-column: 1 / -1;
        }

        label {
            font-size: 13px;
            font-weight: 600;
            color: #374151;
            margin-bottom: 8px;
        }

        input,
        select,
        textarea {
            width: 100%;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            padding: 12px 13px;
            font-size: 14px;
            outline: none;
            background: white;
        }

        textarea {
            min-height: 130px;
            resize: vertical;
        }

        input:focus,
        select:focus,
        textarea:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.08);
        }

        /* SKILLS */
        .skills-help {
            font-size: 12px;
            color: #9ca3af;
            margin-top: 6px;
        }

        /* ACTIONS */
        .actions {
            display: flex;
            justify-content: flex-end;
            gap: 12px;
            border-top: 1px solid #e5e7eb;
            margin-top: 28px;
            padding-top: 22px;
        }

        .btn {
            padding: 12px 23px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            text-decoration: none;
            cursor: pointer;
            border: none;
        }

        .cancel {
            background: #f3f4f6;
            color: #374151;
        }

        .cancel:hover {
            background: #e5e7eb;
        }

        .create {
            background: #2563eb;
            color: white;
        }

        .create:hover {
            background: #1d4ed8;
        }

        /* MOBILE */
        @media (max-width: 800px) {

            .sidebar {
                width: 70px;
                padding: 20px 10px;
            }

            .brand {
                font-size: 0;
                text-align: center;
            }

            .brand span {
                font-size: 22px;
            }

            .menu-title,
            .menu a span {
                display: none;
            }

            .menu a {
                text-align: center;
                font-size: 20px;
            }

            .main {
                margin-left: 70px;
            }

            .content {
                padding: 22px;
            }

            .form-grid {
                grid-template-columns: 1fr;
            }

            .full {
                grid-column: auto;
            }
        }

        @media (max-width: 550px) {

            .topbar {
                padding: 0 18px;
            }

            .topbar h2 {
                font-size: 16px;
            }

            .job-card {
                padding: 20px;
            }

            .actions {
                flex-direction: column;
            }

            .btn {
                width: 100%;
                text-align: center;
            }
        }
    </style>
</head>

<body>

<!-- SIDEBAR -->
<aside class="sidebar">

    <div class="brand">
        AI <span>Smart Hiring</span>
    </div>

    <div class="menu-title">
        Main Menu
    </div>

    <div class="menu">

        <a href="/">
            🏠 <span>Dashboard</span>
        </a>

        <a href="/candidate">
            👤 <span>Candidates</span>
        </a>

        <a href="/add-job" class="active">
            💼 <span>Jobs</span>
        </a>

    </div>

    <div class="menu-title">
        System
    </div>

    <div class="menu">

        <a href="#">
            ⚙️ <span>Settings</span>
        </a>

    </div>

</aside>


<!-- MAIN -->
<div class="main">

    <!-- TOPBAR -->
    <header class="topbar">

        <h2>Create New Job</h2>

        <a href="/" class="back-link">
            ← Back to Dashboard
        </a>

    </header>


    <!-- CONTENT -->
    <main class="content">

        <div class="page-title">

            <h1>Create Job Opening</h1>

            <p>
                Define the role and required skills for your new job opening.
            </p>

        </div>


        <div class="job-card">

            <div class="section-title">
                Job Information
            </div>


            <!-- FORM -->
            <form method="POST" action="/add-job">

                <div class="form-grid">

                    <!-- JOB TITLE -->
                    <div class="form-group">

                        <label for="job_title">
                            Job Title
                        </label>

                        <input
                            type="text"
                            id="job_title"
                            name="job_title"
                            placeholder="e.g. Python Developer"
                            required
                        >

                    </div>


                    <!-- LOCATION -->
                    <div class="form-group">

                        <label for="location">
                            Location
                        </label>

                        <input
                            type="text"
                            id="location"
                            name="location"
                            placeholder="e.g. Chennai, Tamil Nadu"
                            required
                        >

                    </div>


                    <!-- JOB TYPE -->
                    <div class="form-group">

                        <label for="job_type">
                            Employment Type
                        </label>

                        <select id="job_type" name="job_type" required>

                            <option value="">
                                Select employment type
                            </option>

                            <option value="Full Time">
                                Full Time
                            </option>

                            <option value="Part Time">
                                Part Time
                            </option>

                            <option value="Internship">
                                Internship
                            </option>

                            <option value="Contract">
                                Contract
                            </option>

                        </select>

                    </div>


                    <!-- EXPERIENCE -->
                    <div class="form-group">

                        <label for="experience">
                            Experience Required
                        </label>

                        <select id="experience" name="experience" required>

                            <option value="">
                                Select experience
                            </option>

                            <option value="Fresher">
                                Fresher
                            </option>

                            <option value="0-2 Years">
                                0 - 2 Years
                            </option>

                            <option value="2-5 Years">
                                2 - 5 Years
                            </option>

                            <option value="5+ Years">
                                5+ Years
                            </option>

                        </select>

                    </div>


                    <!-- SKILLS -->
                    <div class="form-group full">

                        <label for="skills">
                            Required Skills
                        </label>

                        <input
                            type="text"
                            id="skills"
                            name="skills"
                            placeholder="Python, Flask, SQL, Git, REST API"
                            required
                        >

                        <span class="skills-help">
                            Separate multiple skills using commas.
                        </span>

                    </div>


                    <!-- DESCRIPTION -->
                    <div class="form-group full">

                        <label for="description">
                            Job Description
                        </label>

                        <textarea
                            id="description"
                            name="description"
                            placeholder="Describe the role, responsibilities and requirements..."
                            required
                        ></textarea>

                    </div>

                </div>


                <!-- BUTTONS -->
                <div class="actions">

                    <a href="/" class="btn cancel">
                        Cancel
                    </a>

                    <button
                        type="submit"
                        class="btn create"
                    >
                        Create Job
                    </button>

                </div>

            </form>

        </div>

    </main>

</div>

</body>
</html>
