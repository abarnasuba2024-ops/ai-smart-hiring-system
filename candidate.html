<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Candidate Application - AI Smart Hiring</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            color: #1f2937;
        }

        nav {
            background: #111827;
            padding: 18px 8%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        nav h2 {
            color: white;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin-left: 20px;
        }

        .container {
            max-width: 800px;
            margin: 50px auto;
            padding: 0 20px;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 32px;
            margin-bottom: 10px;
        }

        .header p {
            color: #6b7280;
        }

        .card {
            background: white;
            padding: 35px;
            border-radius: 14px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.08);
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 8px;
        }

        input,
        select {
            width: 100%;
            padding: 13px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            font-size: 15px;
        }

        input:focus,
        select:focus {
            outline: none;
            border-color: #2563eb;
        }

        .resume-box {
            border: 2px dashed #9ca3af;
            padding: 25px;
            text-align: center;
            border-radius: 10px;
            background: #f9fafb;
        }

        .resume-box input {
            border: none;
            background: transparent;
        }

        .submit-btn {
            width: 100%;
            padding: 14px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .submit-btn:hover {
            background: #1d4ed8;
        }
    </style>
</head>

<body>

<nav>
    <h2>AI Smart Hiring</h2>

    <div>
        <a href="index.html">Home</a>
        <a href="add_job.html">Create Job</a>
    </div>
</nav>

<div class="container">

    <div class="header">
        <h1>Candidate Application</h1>
        <p>Submit your details and resume for AI-powered screening</p>
    </div>

    <div class="card">

        <!-- Flask backend receives this form -->
        <form action="/candidate" method="POST" enctype="multipart/form-data">

            <div class="form-group">
                <label>Full Name</label>

                <input
                    type="text"
                    name="name"
                    placeholder="Enter your full name"
                    required>
            </div>

            <div class="form-group">
                <label>Email</label>

                <input
                    type="email"
                    name="email"
                    placeholder="Enter your email"
                    required>
            </div>

            <div class="form-group">
                <label>Mobile Number</label>

                <input
                    type="tel"
                    name="mobile"
                    placeholder="Enter your mobile number"
                    required>
            </div>

            <div class="form-group">
                <label>Location</label>

                <input
                    type="text"
                    name="location"
                    placeholder="Enter your location"
                    required>
            </div>

            <div class="form-group">
                <label>Job Role</label>

                <select name="job_role" required>

                    <option value="">
                        Select Job Role
                    </option>

                    <option value="Python Developer">
                        Python Developer
                    </option>

                    <option value="Java Developer">
                        Java Developer
                    </option>

                    <option value="Web Developer">
                        Web Developer
                    </option>

                    <option value="Full Stack Developer">
                        Full Stack Developer
                    </option>

                    <option value="Data Analyst">
                        Data Analyst
                    </option>

                    <option value="Data Scientist">
                        Data Scientist
                    </option>

                    <option value="Software Engineer">
                        Software Engineer
                    </option>

                </select>
            </div>

            <div class="form-group">

                <label>Upload Resume</label>

                <div class="resume-box">

                    <p>📄 Select your resume</p>

                    <br>

                    <input
                        type="file"
                        name="resume"
                        accept=".pdf,.docx"
                        required>

                    <br><br>

                    <small>
                        Accepted formats: PDF, DOCX
                    </small>

                </div>

            </div>

            <button
                class="submit-btn"
                type="submit">

                Submit Application

            </button>

        </form>

    </div>

</div>

</body>
</html>
